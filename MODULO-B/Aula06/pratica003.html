<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A calculadora simples</title>
</head>
<body>
    <script>
        var n1 = Number(window.prompt('Digite um valor: '))
        var n2 = Number(window.prompt('Digite outro valor: '))
        var soma = n1 + n2
        window.alert(`A soma entre ${n1} + ${n2} é igual a >> ${soma}`)

    </script>
</body>
</html>
