<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        #area {
            background-color: rgb(29, 162, 29);
            color: white;
            font-size: 1.5em;
            text-align: center;
            line-height: 300px;
            padding: 50px;
            width: 300px;
            height: 300px;

        }
    </style>
</head>
<body>
    <div id="area">
        Interaja com o mouse aqui...
    </div>

    <script>

        var area = document.getElementById('area');
        area.addEventListener('click', clicar);
        area.addEventListener('mouseenter', entrou);
        area.addEventListener('mouseout', saiu);

        function clicar() {
            area.innerHTML = 'Clicou!';
            area.style.backgroundColor = 'red';
        }

        function entrou() {
            area.innerHTML = 'Entrou!';
            area.style.backgroundColor = 'blue';
        }

        function saiu() {
            area.innerHTML = 'Saiu!';
            area.style.backgroundColor = 'green';
        }

    </script>
</body>
</html>
